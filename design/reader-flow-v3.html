<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{--paper:#F6F5FC;--line:#D3D0EC;--ink:#2A1F6E;--text:#1E1A3A;--soft:#6A6690;--red:#D8344F;--rose:#F3C3CC;--marker:#FBE36B;--white:#FFFFFF;--ruler:#FCF0B4;--edge:#D9BE3C;
--night:#17123F;--night-text:#DAD6F2;--night-soft:#9C97C9;--night-line:#3A3370}
*{box-sizing:border-box;margin:0}
.wall{display:flex;flex-wrap:wrap;gap:26px 20px;justify-content:center}
figure{width:224px}
figcaption{font:13px/1.45 var(--font-sans,system-ui);color:var(--foreground,#1E1A3A);margin-top:10px}
.ph{zoom:.68;position:relative;width:330px;height:690px;border-radius:38px;overflow:hidden;background:var(--paper);color:var(--text);font-family:Literata,serif;border:1px solid var(--line)}
.hand{font-family:"Patrick Hand",cursive}

/* The margin stays on every state: it is the only thing left while reading. */
.margin{position:absolute;left:28px;top:0;bottom:0;width:3px;background:var(--rose)}
.margin i{position:absolute;left:0;top:0;width:3px;background:var(--red)}
.left{position:absolute;right:calc(100% + 4px);transform:translateY(-14px);font:20px/20px "Patrick Hand",cursive;color:var(--red);white-space:nowrap}

.page{position:absolute;left:44px;right:24px;top:58px;bottom:0;overflow:hidden}
.page small{font-size:12.5px;line-height:22px;color:var(--soft);display:block}
.page h2{font-size:22px;line-height:29px;font-weight:600;color:var(--ink);margin-bottom:14px}
.page p{font-size:17px;line-height:29px;margin-bottom:14.5px}
.page.mid{top:0;padding-top:58px}

.top{position:absolute;top:0;left:0;right:0;height:100px;padding:50px 16px 0 36px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.top>span{font-size:26px;line-height:44px}
.vs{display:flex;gap:16px;font:19px/28px "Patrick Hand",cursive;color:var(--soft)}
.vs b{font-weight:400;color:var(--red);border-bottom:2px solid var(--red)}
.tools{position:absolute;left:0;right:0;bottom:0;height:88px;padding:0 20px 18px 44px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.tools .where{font-size:12.5px;line-height:18px;color:var(--soft)}
.tools .where b{display:block;font:400 20px/22px "Patrick Hand",cursive;color:var(--red)}
.tools .acts{display:flex;gap:6px;font-size:15px;font-weight:600;color:var(--ink)}
.tools .acts span{height:44px;min-width:48px;padding:0 10px;line-height:44px;text-align:center}

.shade{position:absolute;inset:0;background:rgba(30,26,58,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:24px 24px 0 0;padding:12px 20px 30px}
.grip{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:16px;line-height:24px;font-weight:600;color:var(--ink)}
.ruler{position:relative;height:58px;margin:18px 0 20px;background:var(--ruler);border:1px solid var(--edge);border-radius:6px}
.ticks{position:absolute;top:0;left:14px;right:14px;height:14px;background-image:repeating-linear-gradient(to right,var(--text) 0 1px,transparent 1px 25%);border-right:1px solid var(--text)}
.nm{position:absolute;top:20px;width:40px;margin-left:-20px;text-align:center;color:var(--text);font-family:Literata,serif;line-height:30px}
.nm.on{color:var(--red)}
.pin{position:absolute;top:-13px;width:0;height:0;margin-left:-8px;border:8px solid transparent;border-top:12px solid var(--red);border-bottom:0}
.papers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pp{height:64px;border-radius:14px;border:1.5px solid var(--line);padding:9px 14px;font-size:14px;line-height:20px;color:var(--text);background:var(--paper)}
.pp.dark{background:var(--night);color:var(--night-text);border-color:var(--night)}
.pp.on{border:2px solid var(--red)}
.pp small{display:block;font-size:12px;line-height:18px;opacity:.75}

.pop{position:absolute;left:58px;top:236px;width:190px;background:var(--ink);color:#fff;border-radius:14px;font-size:15px;font-weight:600;line-height:46px;text-align:center}
.pop::after{content:"";position:absolute;left:30px;bottom:-7px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg)}
mark{background:var(--marker);color:inherit;padding:2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.end{position:absolute;left:44px;right:24px;bottom:34px}
.done{font:30px/34px "Patrick Hand",cursive;color:var(--red);transform:rotate(-2deg);transform-origin:left;margin-bottom:6px}
.sub{font-size:14px;line-height:22px;color:var(--soft);margin-bottom:18px}
.btn{height:52px;border-radius:14px;background:var(--ink);color:#fff;font:600 16px/52px Literata,serif;text-align:center}
.back-link{font-size:15px;font-weight:600;line-height:44px;color:var(--ink);text-align:center;margin-top:4px}

.night{background:var(--night);color:var(--night-text);border-color:var(--night)}
.night .page small{color:var(--night-soft)}
.night .page h2{color:var(--night-text)}
.night .margin{background:var(--night-line)}
</style></head><body>

<small>Chương Một</small><h2>Nó đòi hỏi kiến thức, kinh nghiệm và năng khiếu</h2>
<p>Tôi thực sự tin rằng, không có gì khó khăn hơn việc kiếm lợi nhuận. Ai cũng nghĩ mình làm được, cho đến khi tự tay thử.</p>
<p>Người mới vào nghề thường chỉ thấy phần dễ. Họ mua khi giá lên, và tin rằng giá sẽ còn lên mãi. Họ không hỏi vì sao mình có quyền thắng người đã ở đây hai mươi năm.</p>
<p>Kiến thức có thể học. Kinh nghiệm phải trả tiền mới có. Còn năng khiếu thì mỗi người tự biết sau vài lần thua.</p>
<p>Vì thế, câu đầu tiên tôi hỏi một người muốn đầu tư không phải là bạn có bao nhiêu tiền.</p>
</div></div>
<figcaption>Khi đọc, màn hình chỉ còn chữ. Đường lề đỏ vẫn là tiến độ, và số phút còn lại viết tay ở lề, đi xuống cùng bạn như số phút trong danh sách chương.</figcaption></figure>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ereader_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
      s3:
        image: localstack/localstack:3
        env:
          SERVICES: s3
        ports: ['4566:4566']
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ereader_test
      TEST_S3_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:boundaries
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      # Plain React must keep building, so Redact stays one line to turn off.
      - run: npm run build
        env:
          WEB_RUNTIME: react
      # The build writes routeTree.gen.ts, which the types need.
      - run: npm run typecheck
      - run: npm run e2e
      - run: npm run build
      - run: '! grep -rlE "TanStackDevtools|solid-primitives" .output'
      - run: npm run e2e

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
